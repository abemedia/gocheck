version: '2'

run:
  build-tags:
    - acceptance

issues:
  fix: true

linters:
  default: all
  disable:
    - depguard
    - exhaustive
    - exhaustruct
    - exhaustruct_v5
    - forcetypeassert
    - gochecknoglobals
    - gocyclo
    - lll
    - mnd
    - nilnil
    - nlreturn
    - paralleltest
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 20
    govet:
      enable-all: true
      disable: [fieldalignment]
    nolintlint:
      require-specific: true
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [errcheck]
        path: (.+)_test.go
      - linters: [govet]
        text: 'shadow: declaration of "err" shadows declaration'
    paths:
      - testdata

formatters:
  enable:
    - gofumpt
    - golines
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
    golines:
      max-len: 120
      tab-len: 2
